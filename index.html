<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="team">
                <h3>HOME</h3>
                <div id="home-score">0</div>
                <div class="button-group">
                    <button class="score-btn btn-home-1" onclick="addOneHome()">+1</button>
                    <button class="score-btn btn-home-2" onclick="addTwoHome()">+2</button>
                    <button class="score-btn btn-home-3" onclick="addThreeHome()">+3</button>
                </div>
            </div>
            <div class="team">
                <h3>GUEST</h3>
                <div id="guest-score">0</div>
                <div class="button-group">
                    <button class="score-btn btn-guest-1" onclick="addOneGuest()">+1</button>
                    <button class="score-btn btn-guest-2" onclick="addTwoGuest()">+2</button>
                    <button class="score-btn btn-guest-3" onclick="addThreeGuest()">+3</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
